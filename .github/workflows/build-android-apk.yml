# Builds the Astra Android app (APK) on GitHub's computers, so you don't need Android Studio.
# Runs on every push that changes android-app/, and from the Actions tab (Run workflow).
# The APK is on the run's page under "Artifacts" as astra-apk (a zip with app-debug.apk inside).
name: Build Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: astra-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
